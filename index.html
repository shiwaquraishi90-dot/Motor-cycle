<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Fonts --> <link rel="preconnect" href="https://fonts.googleapis.com"> <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" > <!-- Bootstrap 5 --> <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" > <!-- Bootstrap Icons --> <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" >
</head>
<body>

    <main>
        <!-- =====================================================
     SECTION 01 — CINEMATIC HERO
====================================================== -->
<section id="hero" class="hero-section">

    <div class="hero-bg"></div>
    <div class="hero-red-glow"></div>

    <div class="container hero-container">
        <div class="row align-items-center min-vh-100">

            <!-- Hero Text -->
            <div class="col-lg-6 hero-content">

                <span class="premium-label" data-reveal="down">
                    THE NEXT GENERATION OF PERFORMANCE
                </span>

                <h1 class="hero-title" data-reveal="down">
                    BUILT TO
                    <span>DOMINATE.</span>
                </h1>

                <p class="hero-description" data-reveal="up">
                    Engineered for riders who demand precision,
                    power and control.
                </p>

                <div class="hero-buttons" data-reveal="up">

                    <a href="#featured"
                       class="btn premium-btn primary-btn">
                        EXPLORE MODEL
                        <i class="bi bi-arrow-up-right"></i>
                    </a>

                    <a href="#performance"
                       class="btn premium-btn outline-btn">
                        DISCOVER PERFORMANCE
                    </a>

                </div>

            </div>


            <!-- Hero Motorcycle -->
            <div class="col-lg-6">

                <div class="hero-bike-wrapper" data-reveal="scale">

                    <img
                        src="https://images.unsplash.com/photo-1558981806-ec527fa84c39?auto=format&fit=crop&w=1600&q=90"
                        alt="Premium motorcycle"
                        class="hero-bike"
                    >

                </div>

            </div>

        </div>
    </div>


    <!-- Scroll Indicator -->
    <div class="hero-scroll">

        <span>SCROLL TO EXPLORE</span>

        <i class="bi bi-arrow-down"></i>

    </div>

</section>
    </main>
    <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="script.js"></script>
</body>
</html>
